name: "Pipeline 2 — Application CI/CD (FastAPI -> ECR -> ECS)"

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/app.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  ECR_REPOSITORY: "aws-gitops-platform-api"
  ECS_CLUSTER: "aws-gitops-platform-cluster"
  ECS_SERVICE: "aws-gitops-platform-service"
  ECS_TASK_FAMILY: "aws-gitops-platform-api"
  CONTAINER_NAME: "api"

jobs:
  # ---------------------------------------------------------------------------
  # JOB 1: Run Python Unit Tests (Pytest)
  # ---------------------------------------------------------------------------
  test:
    name: "1. Unit Tests (Pytest)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "app/requirements.txt"

      - name: Install dependencies & run pytest
        run: |
          pip install -r requirements.txt
          pytest -v

  # ---------------------------------------------------------------------------
  # JOB 2: Build Docker Image, Trivy Security Scan, Push to ECR & Deploy to ECS
  # ---------------------------------------------------------------------------
  build-and-deploy:
    name: "2. Build, Scan (Trivy), Push to ECR & Deploy to ECS"
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC (App-Deploy Role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_APP_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker Image
        id: build-image
        working-directory: app
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Run Trivy Container Vulnerability Scanner
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.build-image.outputs.image }}
          format: "table"
          exit-code: "0"
          severity: "CRITICAL,HIGH"

      - name: Push Docker Image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Deploy New Task Definition to Amazon ECS Fargate
        env:
          IMAGE_URI: ${{ steps.build-image.outputs.image }}
        run: |
          # Download current task definition, swap in the new ECR image & remove the bootstrap placeholder command
          aws ecs describe-task-definition --task-definition $ECS_TASK_FAMILY --query taskDefinition > task-def.json
          jq --arg IMAGE "$IMAGE_URI" '
            .containerDefinitions[0].image = $IMAGE |
            del(.containerDefinitions[0].command) |
            del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)
          ' task-def.json > new-task-def.json

          # Register the new revision and trigger a rolling update on the ECS service
          NEW_TASK_ARN=$(aws ecs register-task-definition --cli-input-json file://new-task-def.json --query 'taskDefinition.taskDefinitionArn' --output text)
          aws ecs update-service --cluster $ECS_CLUSTER --service $ECS_SERVICE --task-definition "$NEW_TASK_ARN" --force-new-deployment